<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Multi-Potted Plant Monitoring - Live Feed</title>
  <style>

    :root {
      --bg: #fffbdf;
      --panel: #EF6905;
      --purewhite: #FFFFFF;
      --text: #000000;
      --fs: clamp(12px, 1.5vw, 18px);
      --lightgreen: #fffbdf;
      --green: #486C2F;
      --topbar-h: 80px;
    }

    * { box-sizing: border-box; }

    html {
      overflow-y: scroll;
      scrollbar-gutter: stable;
    }

    html, body {
      margin: 0;
      height: auto; min-height: 100%;
      width: 100%;
      background: var(--bg);
      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      overflow-x: hidden;
    }

    .stage {
      position: relative;
      width: var(--stage-w);
      height: var(--stage-h);
      min-height: var(--stage-min-h);
      margin: calc(var(--topbar-h) + 2vh) auto 20vh;
      transition: margin-bottom 0.3s;
    }

    .topbar {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: var(--topbar-h);
      background: var(--green);
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    /* Pump command buttons (R / A / S) in the top bar */
    .cmd {
      min-width: 96px;
      height: 40px;
      border: 0;
      border-radius: 20px;
      background: var(--panel);
      color: var(--purewhite);
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    .cmd.sent { background: var(--lightgreen); color: var(--green); }

    .stage.has-open {
      margin-bottom: 60vh;
    }

    .shape-a, .shape-b, .shape-c, .shape-d, .shape-e, .shape-f, .shape-g, .shape-h, .img, .cell {
      position: absolute;
      left: var(--x);
      top: var(--y);
    }

    .shape-a { width: var(--w); height: var(--h); background: var(--panel); border-radius: 22px; z-index: 2; }
    .shape-b { width: var(--w); height: var(--h); background: var(--panel); border-radius: 22px; z-index: 2; }
    .shape-c { display: flex; flex-direction: row; width: var(--w); height: var(--h); background: var(--purewhite); z-index: 3; }
    .shape-d { display: flex; flex-direction: row; width: var(--w); height: var(--h); background: var(--purewhite); z-index: 3; }
    .shape-e { width: var(--w); height: var(--h); background: var(--lightgreen); border-radius: 22px; z-index: 1; }
    .shape-f { width: var(--w); height: var(--h); background: var(--green); border-radius: 22px; z-index: 0; }
    .shape-g { width: var(--w); height: var(--h); background: var(--lightgreen); border-radius: 22px; z-index: 1; }
    .shape-h { width: var(--w); height: var(--h); background: var(--green); border-radius: 22px; z-index: 0; }
    .img     { width: var(--w); z-index: 2; }
    .cell    { font-size: var(--fs); color: var(--text); line-height: 1.2; white-space: nowrap; z-index: 10; }

    /* Color square next to a label (same colors as the graph bars) */
    .swatch { display: inline-block; width: 0.9em; height: 0.9em; margin-left: 6px; vertical-align: -0.1em; border-radius: 2px; }

    /* Desktop Configuration */

    /* Stage (the whole drawing area) */
    .stage { --stage-w: min(92vw, 900px); --stage-h: min(78vh, 700px); --stage-min-h: 520px; }

    /* Orange panel */
    .shape-a { --x: 0%; --y: 3%;  --w: clamp(55px, 11vw, 100px); --h: clamp(55px, 11vw, 100px) }
    .shape-b { --x: 0%; --y: 43%; --w: clamp(55px, 11vw, 100px); --h: clamp(55px, 11vw, 100px) }

    /* Bar Graph Background */
    .shape-c { --x: 74%; --y: 1%;  --w: clamp(55px, 20vw, 500px); --h: clamp(55px, 8vw, 500px) }
    .shape-d { --x: 74%; --y: 40%; --w: clamp(55px, 20vw, 500px); --h: clamp(55px, 8vw, 500px) }

    /* Light Green */
    .shape-e { --x: -1%; --y: 1%;  --w: clamp(900px, 20vw, 2000px); --h: clamp(200px, 8vw, 500px) }
    .shape-g { --x: -1%; --y: 41%;  --w: clamp(900px, 20vw, 2000px); --h: clamp(200px, 8vw, 500px) }

    /* Green */
    .shape-f { --x: -2%; --y: 0%;  --w: clamp(900px, 20vw, 2000px); --h: clamp(200px, 8vw, 500px) }
    .shape-h { --x: -2%; --y: 40%;  --w: clamp(900px, 20vw, 2000px); --h: clamp(200px, 8vw, 500px) }

    /* Images */
    .img-lily  { --x: 5%; --y: 8%;  --w: clamp(55px, 11vw, 100px); }
    .img-snake { --x: 5%; --y: 48%; --w: clamp(55px, 11vw, 100px); }

    /* row 0 (line 1 of data.txt) */
    .c00 { --x: 20%; --y: 5%; }   /* Title        */
    .c01 { --x: 20%; --y: 16%; }  /* PH           */
    .c02 { --x: 28%; --y: 16%; }  /* Moisture     */
    .c03 { --x: 42%; --y: 16%; }  /* Temperature  */
    .c04 { --x: 60%; --y: 16%; }  /* Light        */
    .c05 { --x: 75%; --y: 16%; }  /* Water        */

    /* row 1 (line 2 of data.txt) */
    .c10 { --x: 20%; --y: 44%; }  /* Title        */
    .c11 { --x: 20%; --y: 56%; }  /* PH           */
    .c12 { --x: 28%; --y: 56%; }  /* Moisture     */
    .c13 { --x: 42%; --y: 56%; }  /* Temperature  */
    .c14 { --x: 60%; --y: 56%; }  /* Light        */
    .c15 { --x: 75%; --y: 56%; }  /* Water        */

    /* Memory matrix (memory.txt): class .m[row][column] */
    /* Default grid position from row/column; :where() keeps it overridable by .m09 etc. */
    .stage { --mx0: 0%; --my0: 100%; --mdx: 9%; --mdy: 5%; }

    :where(.cell[class*=" m"]) {
      --x: calc(var(--mx0) + var(--c) * var(--mdx));
      --y: calc(var(--my0) + var(--r) * var(--mdy));
    }

    /* Column 9 text, placed under the row 0 labels (.c01-.c05) */
    .m09 { --x: 20%; --y: 22%; }  /* under .c01 */
    .m19 { --x: 28%; --y: 22%; }  /* under .c02 */
    .m29 { --x: 42%; --y: 22%; }  /* under .c03 */
    .m39 { --x: 60%; --y: 22%; }  /* under .c04 */
    .m49 { --x: 75%; --y: 22%; }  /* under .c05 */

    /* Column 9 text, placed under the row 1 labels (.c11-.c15) */
    .m59 { --x: 20%; --y: 62%; }  /* under .c11 */
    .m69 { --x: 28%; --y: 62%; }  /* under .c12 */
    .m79 { --x: 42%; --y: 62%; }  /* under .c13 */
    .m89 { --x: 60%; --y: 62%; }  /* under .c14 */
    .m99 { --x: 75%; --y: 62%; }  /* under .c15 */

    /* Bar graph */
    .bars { position: absolute; left: var(--x); top: var(--y); width: 75%; height: 25%; display: flex; flex-direction: row; align-items: flex-end; gap: 18px; z-index: 10; }
    .bar { flex: 1; background: var(--panel); border-radius: 6px 6px 0 0; }
    .b0 { --x: 3%; --y: 45%; gap: 12px; }
    .b1 { --x: 3%; --y: 84%; gap: 12px; }

    .group { flex: 1; height: 100%; display: flex; align-items: flex-end; gap: 1px; }
    .group .bar { flex: 1; border-radius: 3px 3px 0 0; }

    /* Drop-down tab */
    .bars { display: none; }
    .bars.open { display: flex; }

    .toggle {
      position: absolute;
      left: 3%;
      z-index: 10;
      cursor: pointer;
      min-width: 84px;
      height: 36px;
      border: 0;
      border-radius: 18px;
      background: var(--green);
      color: var(--purewhite);
      font-size: 16px;
    }
    .t0 { top: 30%; }
    .t1 { top: 69%; }

    /* Row 1 shifts down by this amount when the top drop-down is open */
    .stage { --shift-amt: 40%; }

    /* Row 1 items only: m5x-m9x belong to row 1, m0x-m4x stay with row 0 */
    .shape-b, .shape-d, .shape-g, .shape-h, .img-snake, .b1, .t1,
    .cell[class*=" c1"],
    .cell[class*=" m5"], .cell[class*=" m6"], .cell[class*=" m7"],
    .cell[class*=" m8"], .cell[class*=" m9"] {
      transition: top 0.3s;
    }

    .stage.shift-down .shape-b,
    .stage.shift-down .shape-d,
    .stage.shift-down .shape-g,
    .stage.shift-down .shape-h,
    .stage.shift-down .img-snake,
    .stage.shift-down .cell[class*=" c1"],
    .stage.shift-down .cell[class*=" m5"],
    .stage.shift-down .cell[class*=" m6"],
    .stage.shift-down .cell[class*=" m7"],
    .stage.shift-down .cell[class*=" m8"],
    .stage.shift-down .cell[class*=" m9"] {
      top: calc(var(--y) + var(--shift-amt));
    }

    .stage.shift-down .b1 {
      top: calc(84% + var(--shift-amt));
    }

    .stage.shift-down .t1 {
      top: calc(69% + var(--shift-amt));
    }

    /* Phone Configuration */
    @media (max-width: 700px) {
      :root { --fs: clamp(12px, 3.2vw, 15px); --topbar-h: 56px; }

      /* Stage height grows with the open drop-downs (+190px each) */
      .stage {
        --stage-w: 94vw;
        --stage-h: 570px;
        --stage-min-h: 0px;
        --shift-amt: 190px;            /* row 1 shifts down by this when the top drop-down opens */
        margin: calc(var(--topbar-h) + 16px) auto 40px;
      }
      .stage.has-open { margin-bottom: 40px; }
      .stage.shift-down { --stage-h: 760px; }
      .stage:has(#bars1.open) { --stage-h: 760px; }
      .stage.shift-down:has(#bars1.open) { --stage-h: 950px; }

      /* Banners: green (f, h) with light green (e, g) on top */
      .shape-f { --x: -2%; --y: 0px;   --w: 104%; --h: 224px; }
      .shape-e { --x: -1%; --y: 4px;   --w: 104%; --h: 224px; }
      .shape-h { --x: -2%; --y: 284px; --w: 104%; --h: 224px; }
      .shape-g { --x: -1%; --y: 288px; --w: 104%; --h: 224px; }

      /* Orange shelf holding the plant name */
      .shape-a { --x: 6%; --y: 86px;  --w: 88%; --h: 34px; }
      .shape-b { --x: 6%; --y: 370px; --w: 88%; --h: 34px; }

      /* Plants stand centered on the shelf */
      .img { height: 68px; transform: translate(-50%, -100%); }
      .img-lily  { --x: 50%; --y: 90px;  --w: auto; }
      .img-snake { --x: 50%; --y: 374px; --w: auto; }

      /* Titles centered on the shelf */
      .c00, .c10 {
        --x: 50%;
        font-size: calc(var(--fs) + 2px);
        font-weight: bold;
        transform: translateX(-50%);
      }

      /* Labels (data.txt): PH, Moisture, Temperature on one line; Light, Water on the next */
      .c00 { --y: 94px; }
      .c01 { --x: 8%;  --y: 132px; }  /* PH           */
      .c02 { --x: 38%; --y: 132px; }  /* Moisture     */
      .c03 { --x: 68%; --y: 132px; }  /* Temperature  */
      .c04 { --x: 8%;  --y: 176px; }  /* Light        */
      .c05 { --x: 38%; --y: 176px; }  /* Water        */

      .c10 { --y: 378px; }
      .c11 { --x: 8%;  --y: 416px; }  /* PH           */
      .c12 { --x: 38%; --y: 416px; }  /* Moisture     */
      .c13 { --x: 68%; --y: 416px; }  /* Temperature  */
      .c14 { --x: 8%;  --y: 460px; }  /* Light        */
      .c15 { --x: 38%; --y: 460px; }  /* Water        */

      /* Live values (memory.txt column 10), directly under each label */
      .m09 { --x: 8%;  --y: 152px; }  /* under .c01 */
      .m19 { --x: 38%; --y: 152px; }  /* under .c02 */
      .m29 { --x: 68%; --y: 152px; }  /* under .c03 */
      .m39 { --x: 8%;  --y: 196px; }  /* under .c04 */
      .m49 { --x: 38%; --y: 196px; }  /* under .c05 */

      .m59 { --x: 8%;  --y: 436px; }  /* under .c11 */
      .m69 { --x: 38%; --y: 436px; }  /* under .c12 */
      .m79 { --x: 68%; --y: 436px; }  /* under .c13 */
      .m89 { --x: 8%;  --y: 480px; }  /* under .c14 */
      .m99 { --x: 38%; --y: 480px; }  /* under .c15 */

      /* Drop-down buttons: centered under each card */
      .toggle {
        left: 50%;
        transform: translateX(-50%);
      }
      .t0 { top: 230px; }
      .t1 { top: 514px; }
      .stage.shift-down .t1 { top: calc(514px + var(--shift-amt)); }

      /* Graphs: full width, only the latest 5 readings (hides the oldest 5) */
      .bars {
        width: 94%;
        height: 180px;
        gap: 10px;
      }

      /* Command buttons fit three across */
      .topbar { gap: 8px; }
      .cmd { min-width: 88px; height: 36px; font-size: 14px; }
      .b0 { --x: 3%; --y: 274px; }
      .b1 { --x: 3%; --y: 558px; }
      .stage.shift-down .b1 { top: calc(var(--y) + var(--shift-amt)); }
      .group { gap: 2px; }
      .group:nth-child(-n+5) { display: none; }
    }
  </style>
</head>

<body>
  <div class="topbar">
    <button class="cmd" data-cmd="R">Manual</button>
    <button class="cmd" data-cmd="A">Auto</button>
    <button class="cmd" data-cmd="S">Stop</button>
  </div>
  <div class="stage">
    <button class="toggle t0" data-target="bars0">▼</button>
    <button class="toggle t1" data-target="bars1">▼</button>

    <div class="shape-a"></div>
    <div class="shape-b"></div>
    <div class="shape-e"></div>
    <div class="shape-f"></div>
    <div class="shape-g"></div>
    <div class="shape-h"></div>

    <img src="snakeplant.png" class="img img-snake" alt="snake plant">
    <img src="peacelily.png"  class="img img-lily"  alt="peace lily">

    <div id="row0"></div>
    <div id="row1"></div>

    <div id="mem"></div>
    <div id="bars0" class="bars b0"></div>
    <div id="bars1" class="bars b1"></div>
  </div>

  <script>
    // WebSocket addresses. Uses the same host the page was loaded from
    // (Cloudflare URL), proxied by nginx to /ws and /mem.
    const proto = location.protocol === "https:" ? "wss" : "ws";
    const WS_URL  = `${proto}://${location.host}/ws`;
    const MEM_URL = `${proto}://${location.host}/mem`;

    const socket = new WebSocket(WS_URL);

    // Builds one row: splits a line by ":" and creates one cell per value.
    // Each cell gets the class c{row}{column}, styled in the CSS above.
    const buildRow = (line, containerId, rowIndex) => {
      const container = document.getElementById(containerId);
      container.replaceChildren();

      (line ?? "")
        .split(":")
        .map((v) => v.trim())
        .filter(Boolean)
        .forEach((text, col) => {
          const cell = document.createElement("div");
          cell.className = `cell c${rowIndex}${col}`;
          cell.textContent = text;
          // Lines 1 and 2 of data.txt, columns 2-6: color square next to the label
          if (col >= 1 && col <= 5) {
            const sw = document.createElement("span");
            sw.className = "swatch";
            sw.style.background = ROW_COLORS[col - 1];
            cell.append(sw);
          }
          container.append(cell);
        });
    };

    // Line 1 of data.txt -> row 0, line 2 -> row 1
    socket.onmessage = (event) => {
      const lines = String(event.data).split(/\r?\n/);
      buildRow(lines[0], "row0", 0);
      buildRow(lines[1], "row1", 1);
    };

    socket.onerror = (error) => console.warn("WebSocket error:", error);

    const memSocket = new WebSocket(MEM_URL);

    memSocket.onerror = (error) => console.warn("Memory WebSocket error:", error);

    // memory.txt: 10 lines, 10 values per line, separated by ":".
    // Column 9 of every row is shown as text (.m09, .m19, ... .m99),
    // except row 1 (Moisture), which shows column 1: the live value from the ESP32.
    const buildMemMatrix = (lines) => {
      const container = document.getElementById("mem");
      container.replaceChildren();

      for (let r = 0; r < 10; r++) {
        const col = 9;
        const text = ((lines[r] ?? "").split(":")[col] ?? "").trim();
        if (!text) continue;

        const cell = document.createElement("div");
        cell.className = `cell m${r}9`;
        cell.style.setProperty("--r", r);
        cell.style.setProperty("--c", 9);
        cell.textContent = text;
        container.append(cell);
      }
    };

    // Grouped bar graph: group = column, color = row
    const MAX_VALS = [16, 2000, 100, 100, 18]; // one max per row/color, in ROW_COLORS order
    const ROW_COLORS = ["#ff5733", "#3498db", "#2ecc71", "#f1c40f", "#9b59b6"];
    const OVER_AT = 0.7;          // above 70% of MAX_VAL the top of the bar changes color
    const OVER_COLOR = "#2b2b2b"; // color of that top part

    const buildGroupedBars = (lines, containerId, startRow) => {
      const container = document.getElementById(containerId);
      container.replaceChildren();

      const rows = lines.slice(startRow, startRow + 5).map((l) =>
        (l ?? "").split(":").map((v) => parseFloat(v))
      );

      for (let c = 0; c < 10; c++) {
        const group = document.createElement("div");
        group.className = "group";
        for (let r = 0; r < 5; r++) {
          const num = rows[r]?.[c];
          const bar = document.createElement("div");
          bar.className = "bar";
          const frac = Math.min(Math.max((num || 0) / MAX_VALS[r], 0), 1);
          bar.style.height = frac * 100 + "%";
          if (frac > OVER_AT) {
            // Part of the bar above OVER_AT of the max gets the warning color
            const cut = (OVER_AT / frac) * 100;   // % of the bar's own height
            bar.style.background =
              `linear-gradient(to top, ${ROW_COLORS[r]} ${cut}%, ${OVER_COLOR} ${cut}%)`;
          } else {
            bar.style.background = ROW_COLORS[r];
          }
          group.append(bar);
        }
        container.append(group);
      }
    };

    memSocket.addEventListener("message", (event) => {
      const lines = String(event.data).split(/\r?\n/);
      buildMemMatrix(lines);
      buildGroupedBars(lines, "bars0", 0);
      buildGroupedBars(lines, "bars1", 5);
    });

    // Drop-down toggles
    const stage = document.querySelector(".stage");

    const syncStage = () => {
      const open0 = document.getElementById("bars0").classList.contains("open");
      const open1 = document.getElementById("bars1").classList.contains("open");
      stage.classList.toggle("shift-down", open0);
      stage.classList.toggle("has-open", open0 || open1);
    };

    // Pump command buttons: send R / A / S to the Pi, which relays it to the ESP32
    document.querySelectorAll(".cmd").forEach((btn) => {
      btn.onclick = () => {
        if (socket.readyState !== WebSocket.OPEN) return;
        socket.send(btn.dataset.cmd);
        btn.classList.add("sent");
        setTimeout(() => btn.classList.remove("sent"), 400);
      };
    });

    document.querySelectorAll(".toggle").forEach((btn) => {
      btn.onclick = () => {
        const el = document.getElementById(btn.dataset.target);
        el.classList.toggle("open");
        btn.textContent = el.classList.contains("open") ? "▲" : "▼";
        syncStage();
      };
    });
  </script>
</body>
</html>
